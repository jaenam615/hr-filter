spring:
  application:
    name: hr-filter-api
  datasource:
    url: jdbc:tc:postgresql:15:///hrfilter?TC_REUSABLE=true
    username: test
    password: test
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
          - loggers
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: local-dev

server:
  port: 12346

management:
  endpoints:
    web:
      exposure:
        include: '*'
