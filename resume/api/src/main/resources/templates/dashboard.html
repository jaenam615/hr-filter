<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>hr-filter 대시보드</title>
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 860px; margin: 40px auto; padding: 0 16px; color: #222; }
        h1 { font-size: 1.5rem; }
        h2 { font-size: 1.1rem; margin-top: 2rem; border-bottom: 1px solid #eee; padding-bottom: 4px; }
        form { background: #f7f7f5; padding: 16px; border-radius: 8px; }
        label { display: block; margin: 8px 0 2px; font-size: 0.85rem; color: #555; }
        input { padding: 6px; width: 100%; max-width: 360px; box-sizing: border-box; }
        button { margin-top: 12px; padding: 8px 16px; background: #2d6cdf; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; font-size: 0.9rem; vertical-align: top; }
        .verdict-PASS { color: #1a7f37; font-weight: 600; }
        .verdict-HOLD { color: #9a6700; font-weight: 600; }
        .verdict-REJECT { color: #cf222e; font-weight: 600; }
        .muted { color: #888; }
        .summary span { margin-right: 14px; }
    </style>
</head>
<body>
<h1>hr-filter 대시보드</h1>

<h2>이력서 업로드</h2>
<form th:action="@{/dashboard/resumes}" method="post" enctype="multipart/form-data">
    <label for="jobPostingId">채용공고 ID</label>
    <input type="number" id="jobPostingId" name="jobPostingId" value="1" required/>
    <label for="applicantName">지원자 이름</label>
    <input type="text" id="applicantName" name="applicantName" required/>
    <label for="applicantEmail">지원자 이메일</label>
    <input type="email" id="applicantEmail" name="applicantEmail" required/>
    <label for="file">이력서 파일</label>
    <input type="file" id="file" name="file" required/>
    <button type="submit">업로드 → MinIO</button>
</form>

<h2>최근 배치 실행</h2>
<p th:if="${batchRuns.isEmpty()}" class="muted">아직 배치 실행 기록이 없습니다.</p>
<table th:unless="${batchRuns.isEmpty()}">
    <thead>
    <tr><th>ID</th><th>상태</th><th>평가</th><th>통과</th><th>보류</th><th>탈락</th><th>실패</th><th>시작</th></tr>
    </thead>
    <tbody>
    <tr th:each="run : ${batchRuns}">
        <td th:text="${run.batchRunId}"></td>
        <td th:text="${run.status}"></td>
        <td th:text="${run.evaluatedCount}"></td>
        <td th:text="${run.passedCount}"></td>
        <td th:text="${run.holdCount}"></td>
        <td th:text="${run.rejectedCount}"></td>
        <td th:text="${run.failedCount}"></td>
        <td th:text="${run.startedAt}"></td>
    </tr>
    </tbody>
</table>

<h2>
    평가 결과
    <span class="muted" th:if="${latestRun != null}"
          th:text="'(최신 배치 #' + ${latestRun.batchRunId} + ')'"></span>
</h2>
<p th:if="${rows.isEmpty()}" class="muted">표시할 평가 결과가 없습니다.</p>
<table th:unless="${rows.isEmpty()}">
    <thead>
    <tr><th>지원자</th><th>판정</th><th>점수</th><th>사유</th><th>평가시각</th></tr>
    </thead>
    <tbody>
    <tr th:each="row : ${rows}">
        <td th:text="${row.applicantName}"></td>
        <td th:classappend="'verdict-' + ${row.verdict}" th:text="${row.verdict}"></td>
        <td th:text="${row.score}"></td>
        <td th:text="${row.reasoning}"></td>
        <td class="muted" th:text="${row.evaluatedAt}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
