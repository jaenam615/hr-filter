spring:
  application:
    name: hr-filter-batch
  main:
    web-application-type: none
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hrfilter}
    username: ${SPRING_DATASOURCE_USERNAME:hrfilter}
    password: ${SPRING_DATASOURCE_PASSWORD:hrfilter}
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

hrfilter:
  notifier:
    channel: ${HRFILTER_NOTIFIER_CHANNEL:slack}
    slack:
      webhook-url: ${HRFILTER_SLACK_WEBHOOK_URL:}
  llm:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${HRFILTER_LLM_MODEL:claude-opus-4-8}
  storage:
    s3:
      endpoint: ${HRFILTER_S3_ENDPOINT:http://localhost:9000}
      access-key: ${HRFILTER_S3_ACCESS_KEY:minioadmin}
      secret-key: ${HRFILTER_S3_SECRET_KEY:minioadmin}
      region: ${HRFILTER_S3_REGION:us-east-1}
      bucket: ${HRFILTER_S3_BUCKET:hrfilter-resumes}
  batch:
    # 제출: 하루 2회 (오전 8시, 오후 2시)
    cron: "0 0 8,14 * * *"
    # 수거: 5분마다 RUNNING 배치 폴링 (논블로킹 재조정)
    collect-cron: "0 */5 * * * *"

management:
  server:
    port: 12347
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
          - loggers
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: local-dev

hrfilter:
  batch:
    # local: 제출·수거 모두 매 1분 (테스트용)
    cron: "0 * * * * *"
    collect-cron: "0 * * * * *"

management:
  endpoints:
    web:
      exposure:
        include: '*'
